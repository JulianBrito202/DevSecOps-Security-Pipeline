name: Flask CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install bandit semgrep

      - name: Verify Flask Imports
        run: |
          python -c "from flask import Flask; print('Flask installed successfully!')"

      - name: Run Bandit Security Scan
        run: |
          bandit -r app

      - name: Run Semgrep Security Scan
        run: |
          semgrep scan --config=auto app

      - name: Build Docker Image
        run: |
          docker build -t devsecops-security-pipeline .

      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-security-pipeline
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          syft dir:. -o cyclonedx-json=sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      zap_scan:

        runs-on: ubuntu-latest

        needs: build

        steps:

          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Build Docker Image
            run: |
              docker build -t devsecops-security-pipeline .

          - name: Run Docker Container
            run: |
              docker run -d -p 5000:5000 --name flask-app devsecops-security-pipeline

          - name: Wait for Application
            run: |
              sleep 20

          - name: Run OWASP ZAP Baseline Scan
            uses: zaproxy/action-baseline@v0.12.0
            with:
              target: "http://host.docker.internal:5000"